name: Backend CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and assemble distribution
        run: ./gradlew --no-daemon clean test installDist

      - name: Build production container
        run: docker build --tag zapasli-backend:ci .

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-only-compose-placeholder
          AUTH_JWT_SECRET_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AUTH_TOKEN_HASH_SECRET_BASE64: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
          ACME_EMAIL: ci@example.invalid
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env ACME_EMAIL=ci@example.invalid
          --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
