services:
  database:
    mem_limit: 1g
    cpus: 0.75

  backend:
    init: true
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 20s
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    init: true
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the server .env file}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
