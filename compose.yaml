name: zapasli

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zapasli}
      POSTGRES_USER: ${POSTGRES_USER:-zapasli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-zapasli} -d ${POSTGRES_DB:-zapasli}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  backend:
    build:
      context: .
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-zapasli}
      DATABASE_USER: ${POSTGRES_USER:-zapasli}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
      DATABASE_MAX_POOL_SIZE: 5
      AUTH_JWT_SECRET_BASE64: ${AUTH_JWT_SECRET_BASE64:?Set AUTH_JWT_SECRET_BASE64 to Base64 of at least 32 random bytes}
      AUTH_TOKEN_HASH_SECRET_BASE64: ${AUTH_TOKEN_HASH_SECRET_BASE64:?Set AUTH_TOKEN_HASH_SECRET_BASE64 to different Base64 of at least 32 random bytes}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-zapasli-backend}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-zapasli-android}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
